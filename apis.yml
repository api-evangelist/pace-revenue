name: Pace Revenue
description: >-
  Pace Revenue was a London-based revenue management and dynamic pricing
  platform for hotels and hospitality operators that used machine learning to
  recommend optimal room rates from real-time demand, market, and booking-pace
  signals. Founded in 2016 and backed by Speedinvest, Pace was acquired by FLYR
  in 2023, and its revenue-optimization technology has since been folded into
  FLYR's hospitality commercial platform. Pace Revenue does not currently
  publish a public developer portal or an openly documented API specification;
  developer resources for the combined offering now live behind FLYR's gated
  developer knowledge base. This profile was surfaced as a Speedinvest portfolio
  company and enriched by the API Evangelist pipeline; no public machine-readable
  API surface was found at enrichment time.
